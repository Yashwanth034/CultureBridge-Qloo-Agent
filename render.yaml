services:
  - type: web
    name: culturebridge-qloo-agent
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/readiness
    envVars:
      - key: NODE_ENV
        value: production
      # Render's edge is Cloudflare + Render load-balancing; client IP must be
      # extracted from the last trusted proxy hops, never from the leftmost
      # arbitrary X-Forwarded-For value. Direct local servers default to 0.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: QLOO_API_KEY
        sync: false
